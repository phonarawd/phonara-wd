name: Actions hygiene

# Weekly prune of failed/cancelled/stale CI runs — keeps latest 3 green runs.
on:
  schedule:
    - cron: '0 3 * * 0'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: actions-hygiene
  cancel-in-progress: false

jobs:
  prune-runs:
    name: prune stale workflow runs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Prune failed/cancelled and excess success runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun run ci:prune-runs -- --apply --keep-success 3
