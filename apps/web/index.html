<!doctype html>
<html lang="ko" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#1A2330" />
    <meta name="color-scheme" content="dark" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="PHONARA" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" href="/phonara-icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
    <link rel="preload" href="/fonts/PretendardVariable.woff2" as="font" type="font/woff2" crossorigin />
    <title>PHONARA</title>
    <style>
      :root {
        --boot-splash-bg: oklch(0.18 0.025 235);
        --boot-splash-fg: oklch(0.86 0.012 240);
        --boot-splash-accent: oklch(0.78 0.18 145);
        --boot-splash-glow: oklch(0.84 0.16 150);
      }
      #boot-splash-static {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: var(--boot-splash-bg);
        color: var(--boot-splash-fg);
        font-family: "Pretendard Variable", Pretendard, system-ui, -apple-system,
          BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        transition: opacity 0.4s ease-out;
      }
      #boot-splash-static .bs-mark {
        font-family: "Pretendard Variable", Pretendard, system-ui, -apple-system,
          BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        font-size: 1.875rem;
        font-weight: 600;
        letter-spacing: -0.01em;
      }
      #boot-splash-static .bs-dots {
        display: flex;
        gap: 0.375rem;
        margin-top: 1.25rem;
      }
      #boot-splash-static .bs-dots i {
        width: 0.5rem;
        height: 0.5rem;
        border-radius: 9999px;
        background: var(--boot-splash-accent);
        box-shadow: 0 0 12px color-mix(in oklab, var(--boot-splash-glow) 60%, transparent);
        display: inline-block;
        animation: splash-dot 1.2s ease-in-out infinite;
      }
      #boot-splash-static .bs-dots i:nth-child(2) {
        animation-delay: 0.16s;
      }
      #boot-splash-static .bs-dots i:nth-child(3) {
        animation-delay: 0.32s;
      }
      @keyframes splash-dot {
        0%,
        80%,
        100% {
          opacity: 0.25;
          transform: scale(0.8);
        }
        40% {
          opacity: 1;
          transform: scale(1.15);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot-splash-static {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="boot-splash-static" aria-hidden="true">
      <div class="bs-mark">PHONARA</div>
      <div class="bs-dots"><i></i><i></i><i></i></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
