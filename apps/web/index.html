    <script>
      (function () {
        try {
          var theme = localStorage.getItem('phonara.settings.theme');
          if (theme !== 'light' && theme !== 'dark' && theme !== 'system') theme = 'dark';
          var root = document.documentElement;
          root.setAttribute('data-theme', theme);
          root.style.colorScheme = theme === 'system' ? 'light dark' : theme;
        } catch (e) {
          /* privacy mode */
        }
      })();
    </script>

    <style>
      :root {
        --boot-splash-bg: oklch(0.145 0.012 260);

        --boot-splash-fg: oklch(0.92 0.01 260);

        --boot-splash-accent: oklch(0.78 0.17 165);

        --boot-splash-glow: oklch(0.78 0.17 165);
      }

      #boot-splash-static {
        position: fixed;

        inset: 0;

        z-index: 100;

        pointer-events: none;

        display: flex;

        flex-direction: column;

        align-items: center;

        justify-content: center;

        background: var(--boot-splash-bg);

        color: var(--boot-splash-fg);

        font-family:
          'Pretendard Variable',
          Pretendard,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          Roboto,
          sans-serif;

        transition: opacity 0.4s ease-out;
      }

      #boot-splash-static .bs-mark {
        width: 3.5rem;

        height: 3.5rem;

        color: var(--boot-splash-accent);
      }

      #boot-splash-static .bs-dots {
        display: flex;

        gap: 0.375rem;

        margin-top: 1.25rem;
      }

      #boot-splash-static .bs-dots i {
        width: 0.5rem;

        height: 0.5rem;

        border-radius: 9999px;

        background: var(--boot-splash-accent);

        box-shadow: 0 0 12px color-mix(in oklab, var(--boot-splash-glow) 60%, transparent);

        display: inline-block;

        animation: splash-dot 1.2s ease-in-out infinite;
      }

      #boot-splash-static .bs-dots i:nth-child(2) {
        animation-delay: 0.16s;
      }

      #boot-splash-static .bs-dots i:nth-child(3) {
        animation-delay: 0.32s;
      }

      @keyframes splash-dot {
        0%,
        80%,
        100% {
          opacity: 0.25;

          transform: scale(0.8);
        }

        40% {
          opacity: 1;

          transform: scale(1.15);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        #boot-splash-static {
          display: none;
        }
      }
    </style>
  </head>

  <body>
    <div id="boot-splash-static" aria-hidden="true">
