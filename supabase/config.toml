project_id = "yocjhjsdwoijfdrehzoq"

[api]
enabled = true
port = 54444
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54442
shadow_port = 54443
# Matches the linked production project (yocjhjsdwoijfdrehzoq runs PostgreSQL 17),
# so local `db reset` and SQL tests run on the same engine as prod.
major_version = 17

[studio]
enabled = true
port = 54445

[inbucket]
# Catch signup/reset/magic-link emails locally (http://127.0.0.1:54424).
enabled = true

[auth]
enabled = true
# Vite may bind 3000–3002 when ports are busy; additional_redirect_urls covers them.
site_url = "http://localhost:3000"
additional_redirect_urls = [
  "http://localhost:3000",
  "http://localhost:3001",
  "http://localhost:3002",
  "http://127.0.0.1:3000",
  "http://127.0.0.1:3001",
  "http://127.0.0.1:3002",
]
jwt_expiry = 3600
enable_signup = true
enable_anonymous_sign_ins = false
enable_manual_linking = false
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
# Local dev defaults — do NOT `supabase config push` without restoring production auth block first.
minimum_password_length = 8

[auth.email]
enable_signup = true
# Local stack only — signup/login without Studio confirm. Remote prod uses enable_confirmations=true (Dashboard / one-off push).
enable_confirmations = false
double_confirm_changes = true
secure_password_change = true
max_frequency = "1s"
otp_length = 8
otp_expiry = 3600

[auth.rate_limit]
# Local dev: relaxed limits for UI/E2E work — never push this block to remote unchanged.
email_sent = 100
sms_sent = 100
anonymous_users = 100
token_refresh = 500
token_verifications = 300
sign_in_sign_ups = 300

[auth.mfa]
max_enrolled_factors = 10

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[auth.mfa.phone]
enroll_enabled = false
verify_enabled = false
otp_length = 6
max_frequency = "10s"

[auth.passkey]
enabled = true

[auth.webauthn]
rp_display_name = "phonara-gb"
rp_id = "localhost"
rp_origins = ["http://localhost:3000", "http://localhost:3001", "http://localhost:3002"]

# Analytics (logflare) is disabled for local dev. On Windows it requires the
# Docker daemon to be exposed on tcp://localhost:2375, which we don't enable.
# It is a local log viewer only and is not needed for development/testing.
[analytics]
enabled = false

[functions.price-feed]
verify_jwt = true
